server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 301 /docs;
    }

    location = /docs {
        try_files /docs/_shell.html =404;
    }

    location = /robots.txt {
        try_files /docs/robots.txt =404;
    }

    location /docs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /docs/og/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /docs/ {
        try_files $uri /docs/_shell.html;
    }

    location / {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
