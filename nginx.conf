server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /docs {
        try_files /docs/index.html /docs/_shell.html =404;
    }

    location /docs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /docs/og/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /docs/ {
        try_files $uri $uri/index.html /docs/_shell.html;
    }

    location / {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
